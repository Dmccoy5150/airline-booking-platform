<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airline Booking</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6fa;
  color: #172033;
}
header {
  background: #071a35;
  color: white;
  padding: 25px 8%;
}
header h1 { margin: 0; font-size: 27px; }
.hero {
  padding: 70px 8%;
  text-align: center;
  background: #102e52;
  color: white;
}
.hero h2 { font-size: 42px; }
.booking {
  max-width: 1000px;
  margin: -25px auto 50px;
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 8px 30px #0002;
}
.fields {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}
input, select, button {
  padding: 15px;
  border-radius: 6px;
  border: 1px solid #ccc;
  width: 100%;
  font-size: 16px;
}
button {
  background: #0879e8;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
}
@media(max-width:650px) {
  .fields { grid-template-columns: 1fr; }
  .hero h2 { font-size: 30px; }
  .booking { margin: 15px; }
}
</style>
</head>
<body>
<header>
<h1>SKYLINE</h1>
</header>
<section class="hero">
<h2>Your journey starts here.</h2>
<p>Discover flights. Compare prices. Travel anywhere.</p>
</section>
<section class="booking">
<h2>Search flights</h2>
<form class="fields" onsubmit="event.preventDefault(); alert('Flight search coming soon!');">
<input placeholder="From — City or airport" required>
<input placeholder="To — City or airport" required>
<input type="date" required>
<input type="date">
<select>
<option>1 Passenger</option>
<option>2 Passengers</option>
<option>3 Passengers</option>
<option>4 Passengers</option>
</select>
<select>
<option>Economy</option>
<option>Premium Economy</option>
<option>Business</option>
<option>First Class</option>
</select>
<button type="submit">Search flights</button>
</form>
</section>
</body>
</html>
